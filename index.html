<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dll</title>
    <!-- Google Fonts: Fredoka for a curvy, cartoony style -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-white: #ffffff;
            --dot-purple: #b19cd9;
            --bar-bg: rgba(255, 255, 255, 0.1);
            --bar-blur: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Background */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Version at the top */
        .version-top {
            position: absolute;
            top: 20px;
            font-size: 1.2rem;
            opacity: 0.6;
            font-weight: 400;
            z-index: 2;
        }

        .hero-container {
            text-align: center;
            user-select: none;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .title {
            font-size: 10rem;
            line-height: 1;
            letter-spacing: 4px;
        }

        .title span {
            color: var(--dot-purple);
        }

        .subtitle {
            font-size: 1.8rem;
            color: var(--text-white);
            opacity: 0.8;
            font-weight: 400;
            min-height: 2.2rem;
        }

        /* Floating Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bar-bg);
            backdrop-filter: blur(var(--bar-blur));
            -webkit-backdrop-filter: blur(var(--bar-blur));
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            gap: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .icon-btn {
            color: var(--text-white);
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 6rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="version-top">version 1</div>

    <canvas id="particle-canvas"></canvas>

    <div class="hero-container">
        <h1 class="title">dll<span>.</span></h1>
        <p id="subtitle" class="subtitle">loading...</p>
    </div>

    <nav class="bottom-bar">
        <a href="games.html" class="icon-btn" title="Games">
            <i data-lucide="gamepad-2" size="28"></i>
        </a>
        <a href="apps.html" class="icon-btn" title="Apps">
            <i data-lucide="layout-grid" size="28"></i>
        </a>
    </nav>

    <script>
        lucide.createIcons();

        const sayings = [ "hamood habibi", "murt", "idk what to put here", "totally math ;)", "blah blah blah bleh bleh bleh blu blu blu", "grannys house", "homer drops his donut DOH" ];

        function setRandomSubtitle() {
            const subtitleElement = document.getElementById('subtitle');
            const randomIndex = Math.floor(Math.random() * sayings.length);
            subtitleElement.textContent = sayings[randomIndex];
        }

        setRandomSubtitle();

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 180 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function connect() {
            if (mouse.x !== null) {
                for (let i = 0; i < particles.length; i++) {
                    const dxMouse = particles[i].x - mouse.x;
                    const dyMouse = particles[i].y - mouse.y;
                    const distanceMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

                    if (distanceMouse < mouse.radius) {
                        ctx.strokeStyle = `rgba(177, 156, 217, ${1 - distanceMouse/mouse.radius})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            connect();
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
