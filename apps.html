<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - dll</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-white: #ffffff;
            --dot-purple: #b19cd9;
            --card-bg: #1a1a2e;
            --bar-blur: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            position: relative;
            padding: 40px 20px;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3rem;
            letter-spacing: 2px;
        }

        .back-btn {
            color: var(--text-white);
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(var(--bar-blur));
        }

        .back-btn:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--dot-purple);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-position: center;
            background-color: #2a2a3e;
        }

        .game-info {
            padding: 15px;
        }

        .game-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-white);
        }

        .game-description {
            font-size: 0.85rem;
            color: #8a8a9e;
            font-weight: 400;
        }

        @media (max-width: 1200px) {
            .games-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 900px) {
            .games-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 600px) {
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>Apps</h1>
            <a href="index.html" class="back-btn">
                <i data-lucide="arrow-left" size="24"></i>
            </a>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Game cards -->
            <a href="Soundboard.html" class="game-card">
                <div class="game-image" style="background-image: url('https://raw.githubusercontent.com/murt391/dll/refs/heads/main/179.png');"></div>
                <div class="game-info">
                    <div class="game-name">Soundboard</div>
                    <div class="game-description">A funny soundboard to troll your friends and teachers with.</div>
                </div>
            </a>
        </div>
    </div>

    <audio id="bgMusic" loop></audio>

    <script>
        lucide.createIcons();

        // Load Settings
        const bgMusic = document.getElementById('bgMusic');
        let dotsEnabled = localStorage.getItem('dotsEnabled') !== 'false';
        let currentSong = localStorage.getItem('currentSong') || '';

        function updateMusic() {
            if (currentSong) {
                bgMusic.src = currentSong;
                bgMusic.play().catch(e => console.log("Autoplay blocked"));
            }
        }
        
        window.addEventListener('click', () => {
            if (currentSong && bgMusic.paused) bgMusic.play();
        }, { once: true });

        updateMusic();

        // Particle system
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 180 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dotsEnabled) {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                if (mouse.x !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < mouse.radius) {
                            ctx.strokeStyle = `rgba(177, 156, 217, ${1 - dist/mouse.radius})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
