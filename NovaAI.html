<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI - dll</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-white: #ffffff;
            --dot-purple: #b19cd9;
            --card-bg: #1a1a2e;
            --bar-blur: 10px;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --user-msg-bg: #2a2a4e;
            --ai-msg-bg: #1e1e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            background: rgba(18, 18, 18, 0.5);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .header h1 span {
            color: var(--dot-purple);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: var(--text-white);
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            height: 45px;
            width: 45px;
            backdrop-filter: blur(var(--bar-blur));
        }

        .back-btn:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }

        .main-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            z-index: 1;
            overflow: hidden;
        }

        /* Sidebar for Model Info */
        .sidebar {
            width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bar-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .sidebar-header {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .model-info {
            padding: 15px;
            background: rgba(177, 156, 217, 0.1);
            border: 1px solid rgba(177, 156, 217, 0.3);
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .model-name {
            color: var(--dot-purple);
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bar-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(177, 156, 217, 0.2);
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px 20px;
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input:focus {
            border-color: var(--dot-purple);
        }

        .send-btn {
            background: var(--dot-purple);
            color: #000;
            border: none;
            border-radius: 15px;
            width: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 5px 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--dot-purple);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @media (max-width: 800px) {
            .sidebar { display: none; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <header class="header">
        <h1>Nova<span>AI</span></h1>
        <div class="header-controls">
            <a href="index.html" class="back-btn" title="Back to Home">
                <i data-lucide="home" size="20"></i>
            </a>
            <a href="settings.html" class="back-btn" title="Settings">
                <i data-lucide="settings" size="20"></i>
            </a>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i data-lucide="cpu" size="18"></i>
                <span>Current Model</span>
            </div>
            <div class="model-info">
                <div class="model-name">GLM 5.2</div>
                <div>A powerful language model optimized for chat and reasoning tasks.</div>
            </div>
        </aside>

        <section class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    Hello! I'm NovaAI powered by GLM 5.2. How can I help you today?
                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <i data-lucide="send" size="20"></i>
                </button>
            </div>
        </section>
    </main>

    <audio id="bgMusic" loop></audio>

    <script>
        lucide.createIcons();

        const API_KEY = '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';
        const BASE_URL = 'https://integrate.api.nvidia.com/v1';
        const MODEL = 'z-ai/glm-5.2';

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let chatHistory = [];

        // Send message logic
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user');
            chatInput.value = '';
            sendBtn.disabled = true;
            
            // Add typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai typing-indicator';
            typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                chatHistory.push({ role: 'user', content: text });
                
                const response = await fetch(`${BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: chatHistory,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await response.json();
                chatMessages.removeChild(typingDiv);
                sendBtn.disabled = false;

                if (data.choices && data.choices[0]) {
                    const aiResponse = data.choices[0].message.content;
                    addMessage(aiResponse, 'ai');
                    chatHistory.push({ role: 'assistant', content: aiResponse });
                } else if (data.error) {
                    addMessage(`Error: ${data.error.message}`, 'ai');
                } else {
                    addMessage('Sorry, I encountered an error processing your request.', 'ai');
                }
            } catch (error) {
                console.error('Error:', error);
                if (chatMessages.contains(typingDiv)) {
                    chatMessages.removeChild(typingDiv);
                }
                sendBtn.disabled = false;
                addMessage(`Failed to connect: ${error.message}`, 'ai');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.onclick = sendMessage;
        chatInput.onkeypress = (e) => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); };

        // Music Logic
        const bgMusic = document.getElementById('bgMusic');
        let currentSong = localStorage.getItem('currentSong') || '';
        let currentVolume = localStorage.getItem('musicVolume') || '0.5';
        let dotsEnabled = localStorage.getItem('dotsEnabled') !== 'false';

        function updateMusic() {
            if (currentSong) {
                bgMusic.src = currentSong;
                bgMusic.volume = parseFloat(currentVolume);
                bgMusic.play().catch(e => console.log("Autoplay blocked"));
            }
        }
        
        window.addEventListener('click', () => {
            if (currentSong && bgMusic.paused) bgMusic.play();
        }, { once: true });

        updateMusic();

        // Particle System
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 180 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dotsEnabled) {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                if (mouse.x !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < mouse.radius) {
                            ctx.strokeStyle = `rgba(177, 156, 217, ${1 - dist/mouse.radius})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
