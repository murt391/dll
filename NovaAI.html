<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI - dll</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-white: #ffffff;
            --dot-purple: #b19cd9;
            --card-bg: #1a1a2e;
            --bar-blur: 10px;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --user-msg-bg: #2a2a4e;
            --ai-msg-bg: #1e1e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            background: rgba(18, 18, 18, 0.5);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .header h1 span {
            color: var(--dot-purple);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: var(--text-white);
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            height: 45px;
            width: 45px;
            backdrop-filter: blur(var(--bar-blur));
        }

        .back-btn:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }

        .main-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            z-index: 1;
            overflow: hidden;
        }

        /* Sidebar for Models */
        .sidebar {
            width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bar-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .model-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 5px;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }

        .model-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .model-item.active {
            background: var(--dot-purple);
            color: #000;
            font-weight: 700;
            border-color: #fff;
        }

        .model-loading {
            padding: 20px;
            text-align: center;
            color: #888;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--bar-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(177, 156, 217, 0.2);
        }

        .message.error {
            align-self: flex-start;
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ff9999;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px 20px;
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input:focus {
            border-color: var(--dot-purple);
        }

        .send-btn {
            background: var(--dot-purple);
            color: #000;
            border: none;
            border-radius: 15px;
            width: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 5px 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--dot-purple);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @media (max-width: 800px) {
            .sidebar { display: none; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Nova<span>AI</span></h1>
        <div class="header-controls">
            <a href="index.html" class="back-btn" title="Back to Home">
                <i data-lucide="home" size="20"></i>
            </a>
            <a href="settings.html" class="back-btn" title="Settings">

            <div class="model-list" id="modelList">
                <div class="model-loading">Loading models...</div>
            </div>
        </aside>

        <section class="chat-area">

                <div class="message ai">

                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <i data-lucide="send" size="20"></i>
                </button>
            </div>
        </section>
    </main>

    <audio id="bgMusic" loop></audio>

    <script>
        lucide.createIcons();

        // Backend API endpoint
        const BACKEND_URL = 'https://8000-imp57jgl73soeycohhcxn-bbf08e2f.us2.manus.computer';

        const modelList = document.getElementById('modelList');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let selectedModel = '';
        let chatHistory = [];
        let isStreaming = false;

        // Fetch available models
        async function fetchModels() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/models`);
                const data = await response.json();
                
                modelList.innerHTML = '';
                if (data.models && data.models.length > 0) {
                    data.models.forEach((model, index) => {
                        const div = document.createElement('div');
                        div.className = 'model-item';
                        if (index === 0) {
                            div.classList.add('active');
                            selectedModel = model;
                        }
                        div.textContent = model;
                        div.onclick = () => {
                            document.querySelectorAll('.model-item').forEach(m => m.classList.remove('active'));
                            div.classList.add('active');
                            selectedModel = model;
                        };
                        modelList.appendChild(div);
                    });
                } else {
                    modelList.innerHTML = '<div class="model-loading">No models found</div>';
                }
            } catch (error) {
                console.error('Error fetching models:', error);
                modelList.innerHTML = '<div class="model-loading">Error loading models</div>';
            }
        }

        // Send message with streaming
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !selectedModel || isStreaming) return;

            // Add user message
            addMessage(text, 'user');
            chatInput.value = '';
            sendBtn.disabled = true;
            isStreaming = true;
            
            // Create AI message container
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.className = 'message ai';
            aiMessageDiv.textContent = '';
            chatMessages.appendChild(aiMessageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                chatHistory.push({ role: 'user', content: text });
                
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: chatHistory,
                        temperature: 0.7,
                        max_tokens: 1024,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                continue;
                            }
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.choices && parsed.choices[0]) {
                                    const delta = parsed.choices[0].delta;
                                    if (delta.content) {
                                        fullResponse += delta.content;
                                        aiMessageDiv.textContent = fullResponse;
                                        chatMessages.scrollTop = chatMessages.scrollHeight;
                                    }
                                }
                            } catch (e) {
                                // Ignore JSON parse errors
                            }
                        }
                    }
                }

                if (fullResponse) {
                    chatHistory.push({ role: 'assistant', content: fullResponse });
                }
            } catch (error) {
                console.error('Error:', error);
                aiMessageDiv.className = 'message error';
                aiMessageDiv.textContent = `Error: ${error.message}`;
            } finally {
                sendBtn.disabled = false;
                isStreaming = false;
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.onclick = sendMessage;
        chatInput.onkeypress = (e) => { if (e.key === 'Enter' && !sendBtn.disabled && !isStreaming) sendMessage(); };

                bgMusic.play().catch(e => console.log("Autoplay blocked"));

        }
        
        window.addEventListener('click', () => {
            if (currentSong && bgMusic.paused) bgMusic.play();
        }, { once: true });

        updateMusic();
