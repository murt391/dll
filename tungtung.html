<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tung Tung Infects</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-white: #ffffff;
            --dot-purple: #b19cd9;
            --infect-red: #ff4d4d;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --bar-blur: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .header-title {
            position: absolute;
            top: 50px;
            font-size: 4rem;
            letter-spacing: 2px;
            text-align: center;
            z-index: 2;
        }

        /* Floating Window */
        .floating-window {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px;
            width: 400px;
            text-align: center;
            backdrop-filter: blur(var(--bar-blur));
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 25px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1rem;
            opacity: 0.7;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--dot-purple);
        }

        /* Infect Button */
        .infect-btn {
            background: var(--dot-purple);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .infect-btn:hover {
            background: var(--infect-red);
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 77, 77, 0.4);
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-white);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        @media (max-width: 600px) {
            .header-title { font-size: 2.5rem; }
            .floating-window { width: 90%; padding: 25px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">
        <i data-lucide="arrow-left" size="20"></i> Home
    </a>

    <canvas id="particle-canvas"></canvas>

    <h1 class="header-title">Tung Tung Infects</h1>

    <div class="floating-window">
        <div class="input-group">
            <label for="docId">Google Doc ID</label>
            <input type="text" id="docId" placeholder="Enter ID here...">
        </div>
        <button class="infect-btn">Infect</button>
    </div>

    <audio id="bgMusic" loop></audio>

    <script>
        lucide.createIcons();

        // Load Global Settings
        const bgMusic = document.getElementById('bgMusic');
        let dotsEnabled = localStorage.getItem('dotsEnabled') !== 'false';
        let currentSong = localStorage.getItem('currentSong') || '';

        function updateMusic() {
            if (currentSong) {
                bgMusic.src = currentSong;
                bgMusic.play().catch(e => console.log("Autoplay blocked"));
            }
        }
        
        window.addEventListener('click', () => {
            if (currentSong && bgMusic.paused) bgMusic.play();
        }, { once: true });

        updateMusic();

        // Particle System
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 180 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dotsEnabled) {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                if (mouse.x !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < mouse.radius) {
                            ctx.strokeStyle = `rgba(177, 156, 217, ${1 - dist/mouse.radius})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
