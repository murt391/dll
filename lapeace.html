<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Peace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050c1a 0%, #0d1b2a 50%, #1b263b 100%);
            color: #e6f1ff;
            font-family: 'Cinzel', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .symbol-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(65, 90, 119, 0.8));
            transition: transform 0.3s ease;
        }

        .symbol-img:hover {
            transform: scale(1.05);
        }

        h1 {
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 6px;
            color: #77abb7;
            text-transform: lowercase;
            text-shadow: 0 0 12px rgba(119, 171, 183, 0.4);
        }

        .search-container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 14px 22px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #e6f1ff;
            background: rgba(27, 38, 59, 0.6);
            border: 1.5px solid #415a77;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: #77abb7;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .search-bar:focus {
            background: rgba(27, 38, 59, 0.9);
            border-color: #77abb7;
            box-shadow: 0 0 12px rgba(119, 171, 183, 0.4);
        }
    </style>
</head>
<body>

    <img class="symbol-img" src="https://raw.githubusercontent.com/murt391/dll/refs/heads/main/lapeace.png" alt="Lapis Lazuli Symbol">
    <h1>la peace</h1>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search...">
    </div>

</body>
</html>
