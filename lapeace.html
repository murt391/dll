<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Peace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050c1a 0%, #0d1b2a 50%, #1b263b 100%);
            color: #e6f1ff;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .symbol-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(65, 90, 119, 0.8));
            transition: transform 0.3s ease;
        }

        .symbol-img:hover {
            transform: scale(1.05);
        }

        h1 {
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: #77abb7;
            text-transform: lowercase;
            text-shadow: 0 0 12px rgba(119, 171, 183, 0.4);
        }

        .search-container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 14px 22px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #e6f1ff;
            background: rgba(27, 38, 59, 0.6);
            border: 1.5px solid #415a77;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: #77abb7;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .search-bar:focus {
            background: rgba(27, 38, 59, 0.9);
            border-color: #77abb7;
            box-shadow: 0 0 12px rgba(119, 171, 183, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="content">
        <img class="symbol-img" src="https://raw.githubusercontent.com/murt391/dll/refs/heads/main/la-peace.png" alt="Lapis Lazuli Symbol">
        <h1>la peace</h1>

        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search...">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; // Slow movement
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(119, 171, 183, 0.7)';
                ctx.fill();
            }
        }

        const particles = [];
        const particleCount = Math.floor((width * height) / 10000);
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Connect to mouse if within radius
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - particles[i].x;
                    const dy = mouse.y - particles[i].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.strokeStyle = `rgba(119, 171, 183, ${1 - distance / mouse.radius})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
