<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Peace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0a192f 0%, #1e3c72 50%, #2a5298 100%);
            color: #e6f1ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(15, 34, 64, 0.65);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(42, 82, 152, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 218, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .symbol-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(41, 128, 185, 0.8));
            transition: transform 0.3s ease;
        }

        .symbol-img:hover {
            transform: scale(1.05);
        }

        h1 {
            margin-top: 1.5rem;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #89cff0;
            text-transform: lowercase;
            text-shadow: 0 0 10px rgba(137, 207, 240, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="symbol-img" src="https://raw.githubusercontent.com/murt391/dll/refs/heads/main/la-peace.png" alt="La Peace.">
        <h1>la peace</h1>
    </div>

</body>
</html>
