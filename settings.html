<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - dll</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-white: #ffffff;
            --dot-purple: #b19cd9;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --bar-blur: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3rem;
            letter-spacing: 2px;
        }

        .back-btn {
            color: var(--text-white);
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 30px;
            backdrop-filter: blur(var(--bar-blur));
        }

        .back-btn:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }

        .settings-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(var(--bar-blur));
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .setting-item:last-child {
            margin-bottom: 0;
        }

        .setting-info h3 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .setting-info p {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* Toggler Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--dot-purple);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        /* Dropdown */
        select {
            background: #333;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            min-width: 150px;
        }

        /* Volume Slider Styling */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 150px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--dot-purple);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .setting-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            select, .volume-container { width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>Settings</h1>
            <a href="index.html" class="back-btn">
                <i data-lucide="arrow-left" size="24"></i>
            </a>
        </div>

        <div class="settings-card">
            <div class="setting-item">
                <div class="setting-info">
                    <h3>Background Dots</h3>
                    <p>Enable or disable the interactive particle background.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="dotToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-info">
                    <h3>Background Music</h3>
                    <p>Choose a track to play across all pages.</p>
                </div>
                <select id="songSwitcher">
                    <option value="">None</option>
                    <option value="https://raw.githubusercontent.com/murt391/dll/refs/heads/main/robloxsong.mp3">Main Music</option>
                    <option value="https://raw.githubusercontent.com/murt391/dll/refs/heads/main/thepenis.mp3">Legacy Music</option>
                    <option value="https://raw.githubusercontent.com/murt391/dll/refs/heads/main/MONTAGEM ONE MORE GAME - DJ KVNXD.mp3">One More Game Funk</option>
                </select>
            </div>

            <div class="setting-item">
                <div class="setting-info">
                    <h3>Music Volume</h3>
                    <p>Adjust the playback volume of the background music.</p>
                </div>
                <div class="volume-container">
                    <i data-lucide="volume-2" size="20"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop></audio>

    <script>
        lucide.createIcons();

        const dotToggle = document.getElementById('dotToggle');
        const songSwitcher = document.getElementById('songSwitcher');
        const volumeSlider = document.getElementById('volumeSlider');
        const bgMusic = document.getElementById('bgMusic');

        // Load Settings
        let dotsEnabled = localStorage.getItem('dotsEnabled') !== 'false';
        let currentSong = localStorage.getItem('currentSong') || '';
        let currentVolume = localStorage.getItem('musicVolume') || '0.5';

        dotToggle.checked = dotsEnabled;
        songSwitcher.value = currentSong;
        volumeSlider.value = currentVolume;
        bgMusic.volume = parseFloat(currentVolume);

        function updateMusic() {
            if (currentSong) {
                bgMusic.src = currentSong;
                bgMusic.play().catch(e => console.log("Autoplay blocked"));
            } else {
                bgMusic.pause();
                bgMusic.src = "";
            }
        }

        dotToggle.onchange = (e) => {
            dotsEnabled = e.target.checked;
            localStorage.setItem('dotsEnabled', dotsEnabled);
        };

        songSwitcher.onchange = (e) => {
            currentSong = e.target.value;
            localStorage.setItem('currentSong', currentSong);
            updateMusic();
        };

        volumeSlider.oninput = (e) => {
            currentVolume = e.target.value;
            bgMusic.volume = parseFloat(currentVolume);
            localStorage.setItem('musicVolume', currentVolume);
        };

        window.addEventListener('click', () => {
            if (currentSong && bgMusic.paused) bgMusic.play();
        }, { once: true });

        updateMusic();

        // Particle System
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 180 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dotsEnabled) {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                if (mouse.x !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < mouse.radius) {
                            ctx.strokeStyle = `rgba(177, 156, 217, ${1 - dist/mouse.radius})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
